# the flambeur tunnel: flambeur.example.com -> http://flambeur.flambeur.svc.cluster.local:80 (routes live in cloudflare).
# needs secret flambeur-tunnel (key: token). the image is multi-arch, so it can land on the pi too
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: flambeur
spec:
  replicas: 2
  selector:
    matchLabels: { app: cloudflared }
  template:
    metadata:
      labels: { app: cloudflared }
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.8.3
          args: [tunnel, --no-autoupdate, --metrics, 0.0.0.0:2000, run]
          env:
            - name: TUNNEL_TOKEN
              valueFrom: { secretKeyRef: { name: flambeur-tunnel, key: token } }
          livenessProbe:
            httpGet: { path: /ready, port: 2000 }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
